<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Planta, quantidades e orçamento de obra por etapa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Orçamento de Obra</title>
<meta name="theme-color" content="#0A0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}































:root{
  color-scheme:dark;
  --bg:#0A0D0C; --bg2:#0F1413; --surface:#141A18; --surface2:#1A2220; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --ink:#F3F1EA; --muted:#8D9892; --dim:#5B6561;
  --accent:#FF7A1A; --accent2:#FFB23F; --accent-ink:#1A0E04; --glow:rgba(255,122,26,.38);
  --blue:#5EC8E5; --good:#3DDC97; --bad:#FF8A7A;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:96px 96px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 10%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 10%,#000 30%,transparent 80%)}
.bgfx::after{content:"";position:absolute;width:460px;height:460px;top:-200px;right:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.35),transparent 65%);filter:blur(40px)}
.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-inline:16px;padding-bottom:120px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:16px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;flex:0 0 auto}
.brand b{font:800 20px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;font:500 10px var(--mono);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.proj{display:flex;gap:6px;align-items:center;min-width:0}
.proj select{max-width:170px;background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font:600 13px var(--body)}
.iconbtn{width:36px;height:36px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font:700 18px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 400px;align-items:start;gap:26px}.side{order:2;position:sticky;top:18px}}
main{display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.sec{display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.sec.show > *{animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:4px}
.sec-head h2{margin:0;font:900 clamp(32px,8vw,50px)/.95 var(--display);text-transform:uppercase}
.sec-head h2 em{font-style:normal;color:var(--accent)}
.sec-head p{margin:0;font:500 12px var(--mono);color:var(--muted);text-align:right;max-width:200px}
.card{background:linear-gradient(180deg,rgba(26,34,32,.94),rgba(18,24,22,.94));border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.card-title{display:flex;align-items:center;gap:10px;font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card-title i{font-style:normal;color:var(--accent);font-weight:700}
.card-title::after{content:"";flex:1;height:1px;background:var(--line)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.fields.f4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.fields.f3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:grid;gap:5px;min-width:0}
.field > span{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{display:flex;align-items:stretch;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;min-width:0}
.num:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.16)}
.num input,.txt{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--ink);font:700 17px var(--mono);padding:10px 4px 10px 10px}
.num input::placeholder,.txt::placeholder{color:var(--dim);font-weight:500}
.num .u{align-self:center;font:600 11px var(--mono);color:var(--muted);padding-right:8px;white-space:nowrap}
.txtwrap{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;display:flex}
.txt{font:600 15px var(--body)}
select.sel{background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px;font:600 14px var(--body);width:100%;min-width:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:10px 6px;border-radius:10px;cursor:pointer;transition:all .3s var(--ease)}
.seg button[aria-pressed="true"]{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:999px;padding:8px 13px;font:700 13px var(--body);cursor:pointer;white-space:nowrap;transition:all .25s var(--ease)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,122,26,.14);box-shadow:0 0 0 1px var(--accent)}
.chip.add{border-style:dashed;color:var(--accent2)}
.btn{border:0;border-radius:12px;padding:12px 14px;font:700 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--accent-ink)}
.btn.ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,138,122,.4)}
.btn svg{width:17px;height:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 auto}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.warnbox{padding:10px 12px;border-radius:12px;background:rgba(255,178,63,.08);border:1px solid rgba(255,178,63,.35);font-size:13px;color:var(--accent2)}
.warnbox button{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer;padding:0}

/* editor */
.ed-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#0C1110}
.ed{display:block;width:100%;height:min(62vh,440px);touch-action:none;user-select:none}
@media (min-width:980px){.ed{height:520px}}
.ed-tools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.ed-tools > *{pointer-events:auto}
.tool{border:1px solid var(--line2);background:rgba(10,13,12,.88);color:var(--ink);border-radius:10px;padding:8px 11px;font:700 12px var(--body);cursor:pointer}
.tool[aria-pressed="true"]{background:var(--blue);color:#06212a;border-color:var(--blue)}
.tool.go{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--accent-ink);border:0}
.ed-zoom{position:absolute;right:8px;bottom:8px;display:grid;gap:6px}
.ed-selbar{position:absolute;left:8px;top:8px;right:8px;margin:0 auto;width:max-content;display:flex;align-items:center;gap:4px;padding:5px;border-radius:14px;background:rgba(20,26,24,.96);border:1px solid var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:3;max-width:calc(100% - 16px);white-space:nowrap}
.ed-selbar b{font:700 12px var(--body);color:var(--ink);padding:0 8px;overflow:hidden;text-overflow:ellipsis;max-width:90px;min-width:0}
.ed-selbar button{flex:none;min-width:38px;height:40px;border:0;border-radius:10px;background:var(--surface2);color:var(--ink);font:600 13px var(--body);padding:0 9px;cursor:pointer}
.ed-selbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ed-selbar button.dz{background:rgba(255,138,122,.16);color:var(--bad)}
.v3ctl{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:3px;padding:4px;border-radius:12px;background:rgba(20,26,24,.9);border:1px solid var(--line2);max-width:calc(100% - 16px);overflow-x:auto}
.v3ctl button{flex:none;border:0;border-radius:9px;background:transparent;color:var(--ink);font:600 12px var(--body);padding:8px 10px;cursor:pointer}
.v3ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ed-selbar:not([hidden]) ~ .v3ctl{top:60px}
.loupe{position:absolute;z-index:6;width:132px;height:132px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);background:#0C1110;box-shadow:0 10px 36px rgba(0,0,0,.7);pointer-events:none}
.loupe svg{width:100%;height:100%;display:block}
.lp-h,.lp-v{position:absolute;background:rgba(255,178,63,.9)}
.lp-h{left:50%;top:50%;width:26px;height:1.5px;margin:-.75px 0 0 -13px}.lp-v{left:50%;top:50%;width:1.5px;height:26px;margin:-13px 0 0 -.75px}
.loupe span{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:700 10px var(--mono);color:#FFB23F;text-shadow:0 1px 3px #000,0 0 6px #000}
.gdirs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.gdirs .btn{padding:8px 6px}
.pargrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pargrid .num{grid-column:1/-1}.pargrid .btn{padding:8px 6px}
.gp-h .btn{padding:6px 10px}
.dimbox{z-index:7;top:58px;left:50%;right:auto;transform:translateX(-50%);border-color:var(--accent)}
.opsets{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0}.opsets span{font:700 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;min-width:62px}.opsets .chip{padding:6px 9px;font-size:12px}.opsets .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.ptypes{display:grid;grid-template-columns:1fr 1fr;gap:4px}.seg.ptypes button{min-width:0}
.gpair{border:1px solid var(--line2);border-radius:12px;padding:10px;display:grid;gap:8px;background:rgba(61,220,151,.05)}
.gp-h{display:flex;align-items:center;justify-content:space-between;gap:6px;font:700 11px var(--mono)}
.gp-a{color:#3DDC97}.gp-b{color:var(--accent)}
.favbar{position:absolute;left:8px;top:70%;z-index:4;display:flex;align-items:center;gap:3px;padding:4px;border-radius:14px;background:rgba(20,26,24,.96);border:1px solid var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.55);max-width:calc(100% - 8px);overflow-x:auto;scrollbar-width:none;touch-action:none}
.favbar::-webkit-scrollbar{display:none}
.favbar.vert{flex-direction:column;max-width:none;max-height:calc(100% - 8px);overflow-x:hidden;overflow-y:auto}
.favbar.dragging{opacity:.85;box-shadow:0 12px 40px rgba(0,0,0,.8);outline:1px solid var(--accent)}
.fb-grip{flex:none;width:22px;height:38px;display:grid;place-items:center;color:var(--dim);font:700 14px var(--mono);letter-spacing:-3px;cursor:grab;user-select:none}
.favbar.vert .fb-grip{width:38px;height:22px;letter-spacing:0;transform:rotate(90deg)}
.fb-it{flex:none;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:grid;place-items:center;font:600 18px var(--body);cursor:pointer;padding:0}
.fb-it svg{width:22px;height:22px}
.fb-it[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fb-it:disabled{opacity:.3}
.fb-add{color:var(--accent2);font-size:17px}
.fb-sep{flex:none;width:1px;height:26px;background:var(--line2);margin:0 2px}
.favbar.vert .fb-sep{width:26px;height:1px;margin:2px 0}
.tool,.libit{position:relative}
.star{position:absolute;top:1px;right:3px;font-size:13px;line-height:1;color:var(--dim);padding:3px;cursor:pointer}
.star[aria-pressed="true"]{color:var(--accent2)}
.fp-list{max-height:52vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.fp-list .ws-h{grid-column:1/-1;margin-top:6px}
.fp-it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font:600 12px var(--body);text-align:left;cursor:pointer;min-width:0}
.fp-it span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-it b{color:var(--dim)}.fp-it[aria-pressed="true"]{border-color:var(--accent)}.fp-it[aria-pressed="true"] b{color:var(--accent2)}
.fp-ic{width:24px;height:24px;display:grid;place-items:center;flex:none}.fp-ic svg{width:22px;height:22px}
.favpick .seg{margin-bottom:10px}
.ed-status{position:absolute;left:8px;bottom:8px;font:600 11px var(--mono);color:var(--muted);background:rgba(10,13,12,.85);padding:6px 9px;border-radius:8px;max-width:70%}
.selpanel{display:grid;gap:10px;padding:12px;border-radius:14px;border:1px solid rgba(255,122,26,.45);background:rgba(255,122,26,.05)}
.selpanel .ttl{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent2)}
.list{display:grid;gap:8px}
.item{display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2)}
.item-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,110px) 34px;gap:6px;align-items:center}
.del{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:500 17px/1 var(--mono);cursor:pointer}
.addbtn{border:1.5px dashed rgba(255,122,26,.55);background:rgba(255,122,26,.05);color:var(--accent2);border-radius:12px;padding:12px;font:700 14px var(--body);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.stat span{display:block;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font:800 22px var(--display);letter-spacing:.02em}

/* resumo lateral / hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,26,.22),transparent 55%),linear-gradient(160deg,#1B2321,#0F1413 70%);border:1px solid var(--line2);box-shadow:0 20px 60px -20px rgba(0,0,0,.8)}
.eyebrow{font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent2)}
.readout{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:4px}
.odo{font:900 clamp(46px,13vw,70px)/1 var(--display);display:flex;text-shadow:0 0 30px rgba(255,122,26,.25)}
.odo .col{position:relative;height:1em;overflow:hidden;width:.52em;text-align:center;mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.odo .strip{display:flex;flex-direction:column}.odo .strip span{height:1em;line-height:1em;display:block}
.odo .sep{width:.18em}
.unit{font:800 20px/1 var(--display);text-transform:uppercase;color:var(--accent);padding-bottom:.5em}
.hsub{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12.5px var(--mono);color:var(--muted)}
.hsub b{color:var(--ink)}
.stagebars{display:grid;gap:7px;margin-top:14px}
.sb{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:center;font:600 12px var(--body)}
.sb .bar{height:8px;border-radius:5px;background:var(--line2);overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left;transition:transform .8s var(--ease)}
.sb b{font:700 12px var(--mono);white-space:nowrap}

/* orçamento */
.stage{display:grid;gap:10px}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stage-h h3{margin:0;font:800 24px var(--display);text-transform:uppercase;letter-spacing:.03em}
.stage-h b{font:800 22px var(--display);color:var(--accent2)}
.info{display:flex;flex-wrap:wrap;gap:6px}
.info span{font:500 11.5px var(--mono);color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblwrap{overflow-x:auto}
.tbl td{padding:9px 4px;border-bottom:1px dashed var(--line2);vertical-align:baseline}
.tbl td:nth-child(2),.tbl td:nth-child(3),.tbl td:nth-child(4){text-align:right;font:600 13px var(--mono);white-space:nowrap}
.tbl td:first-child{color:var(--ink)}
.tbl tr.nop td:nth-child(4){color:var(--dim)}
.tbl .u{color:var(--muted);font-weight:500}
.total-card{display:grid;gap:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font:600 14px var(--body)}
.tot b{font:700 15px var(--mono)}
.tot.big{font-size:16px;border-top:1px solid var(--line2);padding-top:10px}
.tot.big b{font:800 28px var(--display);color:var(--good);letter-spacing:.02em}
.prices{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line2)}
.pr span{font-size:14px}.pr small{display:block;font:500 11px var(--mono);color:var(--muted)}

/* barra de separadores */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:grid;grid-template-columns:repeat(4,1fr);width:min(520px,calc(100% - 24px));padding:6px;border-radius:22px;background:rgba(20,26,24,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:0 20px 50px -10px rgba(0,0,0,.8)}
.tabbar button{border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:8px 4px;border-radius:16px;cursor:pointer}
.tabbar button svg{width:21px;height:21px}
.tabbar button span{font:800 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.tabbar button[aria-selected="true"]{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--accent-ink)}

<script>
(() => {
const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pf = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = (v, d = 2) => (isFinite(v) ? v : 0).toLocaleString('pt-PT', { minimumFractionDigits: 0, maximumFractionDigits: d });
const fmtFix = (v, d) => (isFinite(v) ? v : 0).toLocaleString('pt-PT', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(6); } catch (e) {} };
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2400); };
const MONO = 'font-family="JetBrains Mono,monospace"';
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ================= dados ================= */
const ROOM_TYPES = { sala: 'Sala', quarto: 'Quarto', cozinha: 'Cozinha', wc: 'WC / Banho', corredor: 'Corredor', varanda: 'Varanda', garagem: 'Garagem', outro: 'Outro' };
const OP_TYPES = { porta_ext: { n: 'Porta exterior', w: .9, h: 2.1, wall: 'ext', k: 'porta' }, porta_int: { n: 'Porta interior', w: .8, h: 2.1, wall: 'int', k: 'porta' },
  janela: { n: 'Janela', w: 1.2, h: 1.0, wall: 'ext', k: 'janela' }, janela_wc: { n: 'Janela WC', w: .6, h: .6, wall: 'ext', k: 'janela' }, portao: { n: 'Portão / garagem', w: 2.5, h: 2.2, wall: 'ext', k: 'portao' } };
const PARAMS = {
  blocoExt: 15, blocoInt: 10, junta: 1, perdas: 5,
  sapB: .6, sapH: .3, limpeza: .05, muretH: .6, vfB: .2, vfH: .2, massame: .07,
  pilB: .15, pilEsp: 3.5, pilN: '', vigB: .15, vigH: .2, lajeE: .12,
  cobertura: 'chapa', incl: 15, beirado: .5, chapaW: .76, chapaL: 3, madeira: 2.5,
  rebocoE: .02, tintaDem: 2, tintaRend: 10,
  acoSap: 50, acoVig: 100, acoPil: 120, acoLaje: 80, acoVerga: 60, varaoD: 10,
  muroH: 1.8, muroBloco: 15, muroPilEsp: 3,
  maoObra: 0
};
const PARAM_UI = [
  ['Paredes', [['blocoExt', 'Bloco paredes exteriores', 'cm', [10, 15, 20]], ['blocoInt', 'Bloco paredes interiores', 'cm', [10, 15, 20]], ['junta', 'Junta', 'cm'], ['perdas', 'Perdas gerais', '%']]],
  ['Fundação', [['sapB', 'Sapata corrida: largura', 'm'], ['sapH', 'Sapata: altura', 'm'], ['limpeza', 'Betão de limpeza', 'm'], ['muretH', 'Murete de fundação (altura)', 'm'], ['vfB', 'Viga de fundação: largura', 'm'], ['vfH', 'Viga de fundação: altura', 'm'], ['massame', 'Massame (piso térreo)', 'm']]],
  ['Estrutura', [['pilB', 'Pilar: lado', 'm'], ['pilEsp', 'Espaçamento de pilares', 'm'], ['pilN', 'Nº de pilares por piso (vazio = automático)', 'un'], ['vigB', 'Viga/cinta: largura', 'm'], ['vigH', 'Viga/cinta: altura', 'm'], ['lajeE', 'Laje: espessura', 'm']]],
  ['Aço (taxas)', [['acoSap', 'Sapatas', 'kg/m³'], ['acoVig', 'Vigas', 'kg/m³'], ['acoPil', 'Pilares', 'kg/m³'], ['acoLaje', 'Lajes', 'kg/m³'], ['acoVerga', 'Vergas', 'kg/m³'], ['varaoD', 'Diâmetro médio do varão', 'mm', [8, 10, 12, 16]]]],
  ['Cobertura', [['cobertura', 'Tipo de cobertura', '', ['chapa', 'laje']], ['incl', 'Inclinação', 'graus'], ['beirado', 'Beirado', 'm'], ['chapaW', 'Chapa: largura útil', 'm'], ['chapaL', 'Chapa: comprimento', 'm'], ['madeira', 'Madeira (barrotes/ripas)', 'm/m²']]],
  ['Muro de vedação', [['muroH', 'Altura do muro', 'm'], ['muroBloco', 'Bloco do muro', 'cm', [10, 15, 20]], ['muroPilEsp', 'Espaçamento dos pilaretes', 'm']]],
  ['Acabamentos', [['rebocoE', 'Reboco: espessura', 'm'], ['tintaDem', 'Tinta: demãos', 'un'], ['tintaRend', 'Tinta: rendimento', 'm²/L'], ['maoObra', 'Mão de obra', '% materiais']]]
];
const PRICE_ITEMS = [
  ['cimento', 'Cimento', 'saco 50 kg'], ['areia', 'Areia', 'm³'], ['brita', 'Brita', 'm³'],
  ['bloco10', 'Bloco 10', 'un'], ['bloco15', 'Bloco 15', 'un'], ['bloco20', 'Bloco 20', 'un'],
  ['varao', 'Varão (barra 12 m)', 'barra'], ['arame', 'Arame recozido', 'kg'], ['cofragem', 'Cofragem (tábuas/aluguer)', 'm²'], ['escavacao', 'Escavação', 'm³'],
  ['chapa', 'Chapa de cobertura', 'un'], ['madeira', 'Madeira de cobertura', 'm'], ['fixacao', 'Parafusos / pregos de chapa', 'un'], ['impermeab', 'Impermeabilização', 'm²'],
  ['pavimento', 'Pavimento (mosaico/cerâmica)', 'm²'], ['pave', 'Pavê', 'm²'], ['flutuante', 'Piso de madeira / flutuante', 'm²'], ['rodape', 'Rodapé', 'm'], ['tinta', 'Tinta (balde 20 L)', 'balde'],
  ['porta', 'Porta (com aro)', 'un'], ['janela', 'Janela', 'm²'], ['portao', 'Portão', 'un'], ['kitwc', 'Kit WC (sanita, lavatório, chuveiro)', 'un'], ['banca', 'Banca de cozinha', 'un']
];
const newFloor = (name, h) => ({ id: uid(), name, h: h || 2.8, mode: 'desenho', rooms: [], walls: [], objs: [], cols: [], beams: [], slabs: [], list: { C: '', L: '', rooms: [] }, ops: [], img: null, grid: 20 });
const newProject = name => ({ id: uid(), name: name || 'Nova casa', floors: [newFloor('Rés-do-chão')], params: { ...PARAMS }, updated: Date.now() });

let PROJ = store.get('oc-projects', null);
if (!PROJ || !PROJ.length) PROJ = [newProject('Minha primeira casa')];
PROJ.forEach(pr => { pr.params = { ...PARAMS, ...pr.params }; }); PROJ.forEach(pr => pr.floors.forEach(f => { ['walls', 'objs', 'cols', 'beams', 'slabs', 'guides', 'pisos'].forEach(k => f[k] = f[k] || []); }));
let CUR = store.get('oc-current', PROJ[0].id); if (!PROJ.find(p => p.id === CUR)) CUR = PROJ[0].id;
let PRICES = store.get('oc-prices', {});
const P = () => PROJ.find(p => p.id === CUR);
let FL = 0; // piso activo
let tab = store.get('oc-tab', 'planta');
const IMGS = {}; // imagens grandes que não cabem no armazenamento
function save() {
  const p = P(); if (p) p.updated = Date.now();
  if (!store.set('oc-projects', PROJ)) {
    // armazenamento cheio (imagens grandes): guarda sem imagens
    const lite = PROJ.map(pr => ({ ...pr, floors: pr.floors.map(f => { if (f.img && f.img.src) IMGS[f.id] = f.img.src; return { ...f, img: f.img ? { ...f.img, src: null } : null }; }) }));
    store.set('oc-projects', lite); toast('Imagem grande: não fica guardada depois de fechar');
  }
  store.set('oc-current', CUR);
}
const imgSrc = f => f.img ? (f.img.src || IMGS[f.id] || null) : null;

/* ================= geometria ================= */
const U = .05; // precisão das paredes (5 cm)
function floorGeom(f) {
  if (f.mode === 'lista') {
    const C = pf(f.list.C), L = pf(f.list.L), rooms = f.list.rooms;
    const area = rooms.reduce((t, r) => t + pf(r.w) * pf(r.l), 0);
    const foot = C * L || area, ext = C && L ? 2 * (C + L) : 4 * Math.sqrt(area);
    const sumPer = rooms.reduce((t, r) => t + 2 * (pf(r.w) + pf(r.l)), 0);
    const int = Math.max(0, (sumPer - ext) / 2);
    return { ext, int, fw: [], muro: [], area: area || foot, foot, rooms: rooms.map(r => ({ type: r.type, name: r.name, a: pf(r.w) * pf(r.l), per: 2 * (pf(r.w) + pf(r.l)) })) };
  }
  // desenho: paredes a partir dos lados dos compartimentos (lado partilhado = parede interior)
  const cnt = new Map();
  const addEdge = (k) => cnt.set(k, (cnt.get(k) || 0) + 1);
  f.rooms.forEach(r => {
    const x0 = Math.round(r.x / U), y0 = Math.round(r.y / U), x1 = Math.round((r.x + r.w) / U), y1 = Math.round((r.y + r.l) / U);
    for (let x = x0; x < x1; x++) { addEdge('h' + y0 + ':' + x); addEdge('h' + y1 + ':' + x); }
    for (let y = y0; y < y1; y++) { addEdge('v' + x0 + ':' + y); addEdge('v' + x1 + ':' + y); }
  });
  let ext = 0, int = 0; cnt.forEach(c => { if (c === 1) ext += U; else int += U; });
  const fw = [], muro = [];
  (f.walls || []).forEach(w => { const L = Math.hypot(w.x2 - w.x1, w.y2 - w.y1); if (w.type === 'muro') { muro.push({ L, bl: w.bl, h: w.h }); return; } if (w.type === 'ext') ext += L; else int += L; if (pf(w.bl) || pf(w.h)) fw.push({ L, int: w.type === 'int', bl: w.bl, h: w.h }); });

}

  return `<section class="sec" id="sec-precos"><div class="sec-head" style="--i:0"><h2>Tabela de <em>preços</em></h2><p>Os seus preços, guardados neste aparelho</p></div>
  <div class="card" style="--i:1"><div class="card-title"><i>MT</i>Preço por unidade</div>
    <div class="prices">${PRICE_ITEMS.map(([k, n, u]) => `<div class="pr"><span>${n}<small>por ${u}</small></span><div class="num"><input type="number" inputmode="decimal" data-price="${k}" value="${PRICES[k] ?? ''}" placeholder="0"><span class="u">MT</span></div></div>`).join('')}</div>
    <p class="hint">Os preços valem para todos os projectos. A mão de obra configura-se em Técnico → Acabamentos (% sobre materiais).</p></div></section>`;
}
/* ================= ORÇAMENTO ================= */
let R = null;
function orcHTML() {
  return `<section class="sec" id="sec-orc"><div class="sec-head" style="--i:0"><h2>Orçamento <em>por etapa</em></h2><p id="orcSub"></p></div>
    <div id="orcWarn"></div><div id="orcStages" style="display:grid;gap:14px"></div>
    <div class="card total-card" style="--i:6" id="orcTot"></div>
    <div class="card" style="--i:7"><div class="card-title"><i>✓</i>Lista de compras (tudo somado)</div><div class="mlist" id="shopTbl"></div></div>
    <div class="row noprint"><button class="btn primary" data-share>Enviar resumo</button><button class="btn ghost" data-copy>Copiar</button>${IN_FRAME ? '' : '<button class="btn ghost" data-print>Imprimir / PDF</button>'}</div>
  </section>`;
}
function renderOrc() {
  if (!$('orcStages')) return;
  $('orcSub').textContent = `${esc(P().name)} · ${P().floors.length} ${P().floors.length === 1 ? 'piso' : 'pisos'} · ${fmt(R.areaBuilt, 1)} m²`;
  $('orcWarn').innerHTML = R.missing ? `<div class="warnbox">Faltam preços em ${R.missing} ${R.missing === 1 ? 'item' : 'itens'}. As quantidades estão calculadas; <button data-goto="precos">preencher a tabela de preços</button> para ver os custos.</div>` : '';
  $('orcStages').innerHTML = R.stages.map((s, i) => `<div class="card stage" style="--i:${i + 1}"><div class="stage-h"><h3>${s.name}</h3><b>${fmtFix(s.total, 2)} MT</b></div>
    <div class="info">${s.info.map(t => `<span>${t}</span>`).join('')}</div>
    <div class="mlist">${s.rows.length ? s.rows.map(r => `<div class="mrow${r.price ? '' : ' nop'}"><span>${r.name}</span><b>${r.price ? fmtFix(r.sub, 2) + ' MT' : 'sem preço'}</b><small>${fmt(r.q, 2)} ${r.unit}${r.price ? ' × ' + fmt(r.price, 2) + ' MT' : ''}</small></div>`).join('') : '<p class="hint">Sem quantidades: desenhe a planta.</p>'}</div></div>`).join('');
  $('orcTot').innerHTML = `<div class="card-title"><i>Σ</i>Total</div>${R.stages.map(s => `<div class="tot"><span>${s.name}</span><b>${fmtFix(s.total, 2)} MT</b></div>`).join('')}
    <div class="tot"><span>Mão de obra (${fmt(pf(P().params.maoObra))}%)</span><b>${fmtFix(R.mo, 2)} MT</b></div>
    <div class="tot big"><span>Total da obra</span><b>${fmtFix(R.total, 2)} MT</b></div>
    <div class="tot"><span>Custo por m² construído</span><b>${R.areaBuilt ? fmtFix(R.total / R.areaBuilt, 2) : '—'} MT/m²</b></div>`;
  $('shopTbl').innerHTML = PRICE_ITEMS.filter(([k]) => (R.shop[k] || 0) > 1e-6).map(([k, n, u]) => { const q = R.shop[k], qq = ['cimento', 'bloco10', 'bloco15', 'bloco20', 'varao', 'chapa', 'fixacao', 'porta', 'portao', 'kitwc', 'banca'].includes(k) ? Math.ceil(q) : q;
    return `<div class="mrow"><span>${n}</span><b>${fmt(qq, 2)} ${u}</b>${pf(PRICES[k]) ? `<small>${fmtFix(qq * pf(PRICES[k]), 2)} MT</small>` : ''}</div>`; }).join('') || '<p class="hint">Ainda sem materiais.</p>';
}
function shareText() {
  const p = P(); let t = `*Orçamento — ${p.name}*\n${p.floors.length} ${p.floors.length === 1 ? 'piso' : 'pisos'} · ${fmt(R.areaBuilt, 1)} m² construídos\n`;
  R.stages.forEach(s => { t += `\n*${s.name}*: ${fmtFix(s.total, 2)} MT\n` + s.rows.map(r => `• ${r.name}: ${fmt(r.q, 2)} ${r.unit}`).join('\n') + '\n'; });
  t += `\nMão de obra: ${fmtFix(R.mo, 2)} MT\n➡️ *Total: ${fmtFix(R.total, 2)} MT*` + (R.areaBuilt ? ` (${fmtFix(R.total / R.areaBuilt, 0)} MT/m²)` : '');
  return t;
}

/* ================= render / estado ================= */
function heroPaint() {
  setOdo(R.total);
  $('hSub').innerHTML = `<span><b>${fmt(R.areaBuilt, 1)}</b> m²</span><span><b>${P().floors.length}</b> ${P().floors.length === 1 ? 'piso' : 'pisos'}</span><span><b>${R.areaBuilt && R.total ? fmt(R.total / R.areaBuilt, 0) : '—'}</b> MT/m²</span>${R.missing ? `<span style="color:var(--accent2)">${R.missing} preços em falta</span>` : ''}`;
  const mx = Math.max(1, ...R.stages.map(s => s.total));
  $('hBars').innerHTML = R.stages.map(s => `<div class="sb"><span>${s.name}</span><div class="bar"><i style="transform:scaleX(${s.total / mx})"></i></div><b>${fmt(s.total / 1000, 0)} mil</b></div>`).join('');
}
let tmr = null;
function changed(now) { save(); histRecord(); clearTimeout(tmr); const run = () => { R = calc(P()); heroPaint(); floorStats(); if (tab === 'orc') renderOrc(); }; if (now) run(); else tmr = setTimeout(run, 120); }
function renderProjSel() { $('projSel').innerHTML = PROJ.map(p => `<option value="${p.id}" ${p.id === CUR ? 'selected' : ''}>${esc(p.name)}</option>`).join(''); }
function render() {
  if (FL >= P().floors.length) FL = 0;
  if (HIST.pid !== CUR) histInit();
  const html = tab === 'planta' ? plantaHTML() : tab === 'param' ? paramHTML() : tab === 'precos' ? precosHTML() : orcHTML();
  $('main').innerHTML = html;
  const sec = $('main').firstElementChild; sec.classList.add('show');
  document.querySelectorAll('.tabbar [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  R = calc(P()); heroPaint();
  if (tab === 'planta') { floorStats(); if ($('ed') && !ED.ws) { if (ED.ox === -1) fitView(); bindEditor(); renderSel(); requestAnimationFrame(drawEd); } }
  if (ED.ws) refreshWS();
  if (tab === 'orc') renderOrc();
  renderProjSel();
}
function goTab(t) { tab = t; document.body.dataset.tab = t; store.set('oc-tab', t); render(); scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); }
addEventListener('resize', () => { if ($('ed')) drawEd(); });

/* ================= eventos ================= */
document.addEventListener('input', e => {
  const el = e.target, f = floor(), p = P();
  if (el.dataset.fl) { f[el.dataset.fl] = el.dataset.fl === 'h' ? el.value : el.value; if (el.dataset.fl === 'name') document.querySelector(`[data-floor="${FL}"]`).textContent = el.value || 'Piso'; changed(); return; }
  if (el.dataset.lf) { f.list[el.dataset.lf] = el.value; changed(); return; }
  if (el.dataset.lr) { const r = f.list.rooms.find(q => q.id === el.closest('[data-lroom]').dataset.lroom); r[el.dataset.lr] = el.value; changed(); return; }
  if (el.dataset.of) { const o = f.ops.find(q => q.id === el.closest('[data-op]').dataset.op); o[el.dataset.of] = el.value;
    if (el.dataset.of === 't') { const d = OP_TYPES[o.t]; o.w = d.w; o.h = d.h; o.wall = d.wall; el.closest('[data-op]').outerHTML = opHTML(o); } changed(); return; }
  if (el.dataset.pk) { p.params[el.dataset.pk] = el.value; changed(); return; }
  if (el.dataset.price) { PRICES[el.dataset.price] = el.value; store.set('oc-prices', PRICES); changed(); return; }
  if (el.hasAttribute('data-imgop')) { f.img.op = +el.value / 100; drawEd(); changed(); return; }
});
document.addEventListener('change', e => { if (e.target.matches('select[data-of], select[data-lr]')) e.target.dispatchEvent(new Event('input', { bubbles: true })); if (e.target.id === 'projSel') { CUR = e.target.value; FL = 0; ED.ox = -1; ED.sel = null; save(); render(); } });
$('imgFile').addEventListener('change', e => { const file = e.target.files[0]; e.target.value = ''; if (file) loadImage(file).catch(() => toast('Não foi possível abrir o ficheiro')); });
document.addEventListener('click', e => {
  const t = e.target, f = floor(), p = P();
  const tb = t.closest('.tabbar [data-tab]'); if (tb) { goTab(tb.dataset.tab); buzz(); return; }
  const gt = t.closest('[data-goto]'); if (gt) { goTab(gt.dataset.goto); return; }
  const fb = t.closest('[data-floor]'); if (fb) { FL = +fb.dataset.floor; ED.ox = -1; ED.sel = null; render(); buzz(); return; }
  if (t.closest('[data-addfloor]')) { const last = p.floors[p.floors.length - 1]; p.floors.push(newFloor(p.floors.length === 1 ? '1.º andar' : `${p.floors.length}.º andar`, last.h)); FL = p.floors.length - 1; ED.ox = -1; changed(1); render(); return; }
  if (t.closest('[data-dupfloor]')) { const c = JSON.parse(JSON.stringify(f)); c.id = uid(); c.name = f.name + ' (cópia)'; c.rooms.forEach(r => r.id = uid()); c.ops.forEach(o => o.id = uid()); ['walls', 'objs', 'cols', 'beams', 'slabs', 'guides', 'pisos'].forEach(k => (c[k] || []).forEach(o => o.id = uid())); c.list.rooms.forEach(r => r.id = uid()); p.floors.splice(FL + 1, 0, c); FL++; changed(1); render(); toast('Piso duplicado'); return; }
  if (t.closest('[data-delfloor]')) { if (p.floors.length < 2) return; p.floors.splice(FL, 1); FL = Math.max(0, FL - 1); ED.ox = -1; changed(1); render(); toast('Piso apagado'); return; }
  const pm = t.closest('[data-pmode] button'); if (pm) { const v = pm.dataset.v; f.mode = v === 'lista' ? 'lista' : 'desenho'; f.imgMode = v === 'img'; ED.ox = -1; ED.tool = 'mover'; changed(1); render(); if (v === 'img' && !f.img) setTimeout(() => $('imgFile').click(), 150); return; }
  if (t.closest('[data-fit]')) { fitView(); drawEd(); return; }
  if (t.closest('[data-loadimg]')) { $('imgFile').click(); return; }
  if (t.closest('[data-rmimg]')) { f.img = null; delete IMGS[f.id]; changed(1); render(); return; }
  if (t.closest('[data-selclose]')) { ED.sel = null; renderSel(); drawEd(); return; }
  if (t.closest('[data-addlroom]')) { f.list.rooms.push({ id: uid(), name: '', type: f.list.rooms.length ? 'quarto' : 'sala', w: '', l: '' }); changed(1); render(); return; }
  const dl = t.closest('[data-dellroom]'); if (dl) { f.list.rooms = f.list.rooms.filter(r => r.id !== dl.dataset.dellroom); changed(1); render(); return; }
  const ao = t.closest('[data-addop]'); if (ao) { const d = OP_TYPES[ao.dataset.addop]; const o = { id: uid(), t: ao.dataset.addop, w: d.w, h: d.h, q: 1, wall: d.wall }; f.ops.push(o); $('opsList').insertAdjacentHTML('beforeend', opHTML(o)); changed(); buzz(); return; }
  const dop = t.closest('[data-delop]'); if (dop) { f.ops = f.ops.filter(o => o.id !== dop.dataset.delop); dop.closest('[data-op]').remove(); changed(); return; }
  const po = t.closest('[data-popt] button'); if (po) { const k = po.parentElement.dataset.popt, v = po.dataset.v; p.params[k] = isNaN(+v) ? v : +v; po.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === po)); changed(); buzz(); return; }
  if (t.closest('[data-resetparams]')) { p.params = { ...PARAMS }; changed(1); render(); toast('Valores padrão repostos'); return; }
  if (t.closest('[data-share]')) { const tx = shareText(); if (navigator.share) navigator.share({ text: tx }).catch(err => { if (err && err.name !== 'AbortError') copy(tx); }); else copy(tx); return; }
  if (t.closest('[data-copy]')) { copy(shareText()); return; }
  if (t.closest('[data-print]')) { window.print(); return; }
  if (t.closest('#projMenu')) { projMenu(); return; }
});
function copy(tx) { try { navigator.clipboard.writeText(tx).then(() => toast('Copiado'), () => toast('Não foi possível copiar')); } catch (e) { toast('Não foi possível copiar'); } }
function projMenu() {
  const m = $('modal'); m.hidden = false;
  m.innerHTML = `<div class="card"><div class="card-title">Projecto</div>${txtF('Nome do projecto', P().name, 'id="pmName"')}
    <div class="row"><button class="btn primary" data-pm="save">Guardar nome</button></div>
    <div class="row"><button class="btn ghost" data-pm="new">Novo projecto</button><button class="btn ghost" data-pm="dup">Duplicar</button></div>
    ${IN_FRAME ? '' : '<div class="row"><button class="btn ghost" data-pm="exp">Exportar ficheiro</button><button class="btn ghost" data-pm="imp">Importar ficheiro</button></div>'}
    <div class="row"><button class="btn danger" data-pm="del">Apagar projecto</button><button class="btn ghost" data-pm="close">Fechar</button></div></div>`;
  m.onclick = e => {
    const b = e.target.closest('[data-pm]'); if (!b && e.target !== m) return; const a = b ? b.dataset.pm : 'close';
    if (a === 'save') { P().name = $('pmName').value || 'Sem nome'; toast('Nome guardado'); }
    if (a === 'new') { const n = newProject('Casa ' + (PROJ.length + 1)); PROJ.push(n); CUR = n.id; FL = 0; ED.ox = -1; }
    if (a === 'dup') { const c = JSON.parse(JSON.stringify(P())); c.id = uid(); c.name += ' (cópia)'; PROJ.push(c); CUR = c.id; }
    if (a === 'del') { if (PROJ.length < 2) { PROJ = [newProject('Nova casa')]; } else PROJ = PROJ.filter(p => p.id !== CUR); CUR = PROJ[0].id; FL = 0; ED.ox = -1; toast('Projecto apagado'); }
    if (a === 'exp') { const blob = new Blob([JSON.stringify({ project: P(), prices: PRICES }, null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = (P().name || 'projecto') + '.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
    if (a === 'imp') { const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json'; i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); const pr = d.project; pr.id = uid(); PROJ.push(pr); CUR = pr.id; if (d.prices && !Object.keys(PRICES).length) { PRICES = d.prices; store.set('oc-prices', PRICES); } save(); render(); toast('Projecto importado'); } catch (_) { toast('Ficheiro inválido'); } }; i.click(); }
    m.hidden = true; save(); render();
  };
}

document.body.dataset.tab = tab;
render();
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
